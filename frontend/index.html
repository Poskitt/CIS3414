<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI-Driven Social Media Safety System</title>
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/chat.css" />
  </head>
  <body class="chat-page">
    <header class="app-header">
      <div class="app-header__brand">
        <h1 class="app-header__title">AI-Driven Social Media Safety System</h1>
        <p class="app-header__tagline">
          Conversation-Based Harm Detection Framework
        </p>
      </div>
      <nav class="app-header__nav">
        <a href="/moderator.html">Moderator</a>
      </nav>
    </header>

    <div class="chat-layout">
      <aside class="chat-sidebar" aria-label="Conversations">
        <h2 class="chat-sidebar__heading">Chats</h2>
        <ul id="chatList" class="chat-list" aria-label="Conversation list"></ul>
        <button type="button" id="newChat" class="btn btn--secondary btn--block chat-sidebar__new">
          New chat
        </button>
      </aside>

      <div class="chat-main">
        <header class="chat-conv-head">
          <div class="chat-conv-head__title" id="convTitle">Pick a chat</div>
          <div class="chat-conv-head__id mono" id="convPublicId"></div>
        </header>

        <div class="chat-toolbar">
          <label>
            Send as
            <select id="userSelect" aria-label="Send as user"></select>
          </label>
          <span id="riskLabel" aria-live="polite"></span>
        </div>

        <div
          id="riskBanner"
          class="risk-banner"
          role="status"
          aria-live="polite"
        ></div>

        <div
          id="safetyModal"
          class="modal-backdrop"
          aria-hidden="true"
          aria-modal="true"
        >
          <div class="modal" role="dialog" aria-labelledby="safetyModalTitle">
            <h2 id="safetyModalTitle">Safety alert</h2>
            <p>
              This conversation may involve unsafe behaviour. You can report
              or dismiss this notice.
            </p>
            <div class="modal__actions">
              <button type="button" id="modalReport" class="btn btn--primary">
                Report
              </button>
              <button
                type="button"
                id="modalDismiss"
                class="btn btn--secondary"
              >
                Dismiss
              </button>
            </div>
          </div>
        </div>

        <section
          class="thread"
          id="thread"
          aria-label="Message thread"
          aria-live="polite"
        ></section>

        <section class="composer" aria-label="Compose message">
          <textarea
            id="input"
            placeholder="Type a message…"
            aria-label="Message text"
          ></textarea>
          <p class="hint">
            Enter: send · Shift+Enter: new line · Tab: switch Alice/Bob
          </p>
          <div class="btn-row">
            <button type="button" id="send" class="btn btn--primary">
              Send
            </button>
            <button type="button" id="refresh" class="btn btn--secondary">
              Refresh
            </button>
            <button type="button" id="analyze" class="btn btn--secondary">
              Re-analyze
            </button>
            <button type="button" id="report" class="btn btn--danger">
              Report
            </button>
          </div>
          <p id="restrictNote" class="mono hint"></p>
        </section>
      </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/chat.js"></script>
  </body>
</html>
