<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Moderator</title>
<style>
:root{--bg:#0f1419;--panel:#1a2332;--text:#e7ecf3;--muted:#8b9bb4;--accent:#3d8bfd;--danger:#d9534f;--border:#2a3545;}
body{margin:0;font-family:Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--text);}
a{color:var(--accent);}
header{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.25rem;border-bottom:1px solid var(--border);background:var(--panel);}
h1{font-size:1.1rem;margin:0;}
main{max-width:960px;margin:0 auto;padding:1rem;}
table{width:100%;border-collapse:collapse;font-size:.85rem;}
th,td{border-bottom:1px solid var(--border);padding:.45rem .35rem;text-align:left;vertical-align:top;}
th{color:var(--muted);font-weight:500;}
.mono{font-family:ui-monospace,monospace;font-size:.78rem;}
button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:.45rem .85rem;cursor:pointer;margin-right:.35rem;}
button.secondary{background:transparent;border:1px solid var(--border);color:var(--text);}
button.danger{background:var(--danger);}
.detail{margin-top:1rem;padding:.75rem;border:1px solid var(--border);border-radius:8px;background:var(--panel);}
</style>
</head>
<body>
<header><h1>Moderator queue</h1><nav><a href="/index.html">Chat</a></nav></header>
<main>
<p style="color:var(--muted);font-size:.9rem">Open cases. Dismiss clears send restriction.</p>
<table><thead><tr><th>ID</th><th>Conversation</th><th>Src</th><th>Prio</th><th>Preview</th><th>Risk</th></tr></thead><tbody id="rows"></tbody></table>
<div class="detail" id="detail" hidden><h2 style="margin-top:0;font-size:1rem">Case</h2><pre id="json" class="mono" style="white-space:pre-wrap;margin:0"></pre>
<div style="display:flex;gap:.5rem;margin-top:.75rem;flex-wrap:wrap"><button type="button" id="dismiss">Dismiss</button><button type="button" class="danger" id="confirm">Confirm</button><button type="button" class="secondary" id="close">Close</button></div></div>
</main>
<script>
const API="/api/moderator";let cases=[],selected=null;
function el(id){return document.getElementById(id);}
function escapeHtml(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");}
function render(){const tbody=el("rows");tbody.innerHTML="";
for(const c of cases){const r=c.latest_risk;const riskStr=r?`${r.tier} (${r.final_score})`:"-";
const title=c.conversation_title||("Conv "+c.conversation_id);const pid=c.conversation_public_id||"";
const tr=document.createElement("tr");tr.innerHTML=`<td class="mono">${c.id}</td><td><div>${escapeHtml(title)}</div><div class="mono" style="font-size:.72rem;color:var(--muted)">#${c.conversation_id} ${escapeHtml(pid)}</div></td><td>${c.source}</td><td>${c.priority}</td><td>${escapeHtml(c.preview)}</td><td class="mono">${riskStr}</td>`;
tr.style.cursor="pointer";tr.onclick=()=>{selected=c;el("detail").hidden=false;el("json").textContent=JSON.stringify(c,null,2);};tbody.appendChild(tr);}}
async function load(){const res=await fetch(`${API}/conversations`);if(!res.ok){alert("load failed");return;}cases=await res.json();render();}
async function act(path){if(!selected)return;const note=prompt("Moderator note (optional):","")??"";
const res=await fetch(`${API}/cases/${selected.id}/${path}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({note:note||null})});
if(!res.ok){alert("failed");return;}selected=null;el("detail").hidden=true;await load();}
el("dismiss").onclick=()=>act("dismiss");el("confirm").onclick=()=>act("confirm");el("close").onclick=()=>{selected=null;el("detail").hidden=true;};
load().catch(()=>alert("Start API"));
</script>
</body>
</html>
