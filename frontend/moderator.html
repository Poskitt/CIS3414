<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moderator — safety demo</title>
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/moderator.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Moderator queue</h1>
      <nav>
        <a href="/index.html">Chat</a>
      </nav>
    </header>

    <main class="mod-main">
      <p class="mod-intro">
        Open cases from automated or user reports. Dismiss clears the send
        restriction for that conversation.
      </p>

      <div class="mod-table-wrap">
        <table class="mod-table">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Conversation</th>
              <th scope="col">Source</th>
              <th scope="col">Priority</th>
              <th scope="col">Preview</th>
              <th scope="col">Risk</th>
            </tr>
          </thead>
          <tbody id="caseRows"></tbody>
        </table>
      </div>

      <section class="mod-detail" id="caseDetail" hidden>
        <h2>Case detail</h2>
        <pre id="caseJson" class="mono"></pre>
        <div class="btn-row">
          <button type="button" id="dismiss" class="btn btn--primary">
            Dismiss
          </button>
          <button type="button" id="confirm" class="btn btn--danger">
            Confirm
          </button>
          <button type="button" id="closeDetail" class="btn btn--secondary">
            Close
          </button>
        </div>
      </section>
    </main>

    <script src="/js/utils.js"></script>
    <script src="/js/moderator.js"></script>
  </body>
</html>
